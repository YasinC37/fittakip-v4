.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.chips{display:flex;gap:7px;overflow:auto;padding:4px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:#151515;color:#ccc;border-radius:999px;padding:8px 11px}.chip.on{background:#351b08;color:var(--orange2);border-color:#7a3e0c}
input,select{width:100%;background:#111;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}label{font-size:12px;color:var(--muted);display:block;margin:8px 0 5px}
.progress{height:9px;background:#292929;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange2));border-radius:99px}
 .workoutHero{display:flex;align-items:center;justify-content:space-between;border-color:#5a300f}.heroIcon{font-size:38px}.moveCard{background:linear-gradient(145deg,#151515,#0e0e0e);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:12px 0}.moveVisual{height:145px;background:radial-gradient(circle at 50% 40%,#2b1708,#101010);display:grid;place-items:center;position:relative}.moveVisual svg{width:92%;height:92%}.moveBody{padding:14px}.moveMeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#1d1d1d;color:#bbb;border:1px solid #303030}.target{color:var(--orange2)}.learnVisual{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.frame{background:#111;border:1px solid #2b2b2b;border-radius:12px;padding:6px;text-align:center}.frame svg{width:100%;height:95px}.arrowLegend{font-size:12px;color:#aaa;text-align:center;margin:4px 0 12px}.stepList{counter-reset:steps;padding-left:0;list-style:none}.stepList li{counter-increment:steps;display:flex;gap:10px;margin:10px 0}.stepList li:before{content:counter(steps);min-width:25px;height:25px;border-radius:50%;background:var(--orange);color:#090909;font-weight:900;display:grid;place-items:center}.moveTap{cursor:pointer}
.photoGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.categoryGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.categoryCard{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#111;cursor:pointer;min-height:145px}.categoryCard img{width:100%;height:145px;object-fit:cover;display:block}.categoryCard:after{content:'';position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.95))}.categoryInfo{position:absolute;left:12px;right:12px;bottom:10px;z-index:1}.categoryInfo b{font-size:18px}.categoryInfo span{display:block;color:#bbb;font-size:12px}.movePhoto{width:100%;height:180px;object-fit:cover;display:block}.phaseGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.phaseCard{background:#0d0d0d;border:1px solid #2b2b2b;border-radius:13px;padding:7px}.phaseCard img{width:100%;height:105px;object-fit:cover;border-radius:9px}.phaseCard b{font-size:12px;display:block;margin-top:6px}.photoNote{font-size:10px;color:#777;margin-top:7px}

.big{font-size:38px;font-weight:900}.ring{width:150px;height:150px;border-radius:50%;border:12px solid #272727;border-top-color:var(--orange);display:grid;place-items:center;margin:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:end;z-index:20}.modal.open{display:flex}.sheet{background:#111;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px;width:100%;max-height:86vh;overflow:auto}.close{float:right}
.badge{border:1px solid #693508;border-radius:16px;padding:14px;background:#17110b;text-align:center}.rank{font-size:25px;font-weight:900;color:var(--orange)}
.quote{font-style:italic;color:#ddd}.tiny{font-size:11px;color:#777}

.timerWrap{display:grid;place-items:center;padding:12px 0 18px}.timer{font-size:58px;font-weight:950;letter-spacing:-2px}.timer.warn{color:var(--red);animation:pulse .8s infinite}.timerLabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.liveMove{font-size:25px;font-weight:900}.liveMeta{color:var(--muted);margin-top:4px}.liveBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.streak{display:flex;align-items:center;gap:12px}.streakIcon{font-size:42px;filter:drop-shadow(0 0 10px rgba(255,118,0,.25))}.streakIcon.s4{filter:hue-rotate(35deg) drop-shadow(0 0 10px rgba(255,118,0,.3))}.streakIcon.s7{filter:hue-rotate(150deg) drop-shadow(0 0 10px rgba(80,160,255,.35))}.streakIcon.s14{filter:hue-rotate(245deg) drop-shadow(0 0 10px rgba(160,80,255,.4))}.streakIcon.s30{filter:hue-rotate(300deg) saturate(1.8) drop-shadow(0 0 12px rgba(255,200,60,.45))}.streakIcon.s100{filter:grayscale(1) brightness(1.8) drop-shadow(0 0 14px white)}@keyframes pulse{50%{transform:scale(1.06);opacity:.72}}
@media(min-width:700px){.page{padding:20px}.nav{left:calc(50% - 380px);right:calc(50% - 380px);border-radius:18px 18px 0 0}.grid{grid-template-columns:repeat(4,1fr)}}

.foodVisual{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid #242424}
.foodVisual:last-child{border-bottom:0}
.foodThumb{width:58px;height:58px;border-radius:14px;object-fit:cover;flex:none;border:1px solid #303030;background:#111}
.foodThumb.big{width:82px;height:82px;border-radius:16px}
.foodInfo{min-width:0;flex:1}
.foodInfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foodPill{display:inline-block;font-size:10px;padding:4px 7px;border-radius:999px;background:#1b1b1b;color:#aaa;border:1px solid #303030;margin-top:5px}
.foodHero{display:grid;grid-template-columns:1.15fr .85fr;gap:10px;align-items:stretch}
.foodHero img{width:100%;height:170px;object-fit:cover;border-radius:16px;border:1px solid #303030}
.foodHeroText{display:flex;flex-direction:column;justify-content:center}
.calendarStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calendarStat{background:#101010;border:1px solid var(--line);border-radius:14px;padding:12px}
.calendarStat b{font-size:20px;display:block}
.calendarStat span{font-size:11px;color:var(--muted)}
.weekStrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.dayCell{border:1px solid var(--line);background:#101010;border-radius:12px;padding:8px 3px;text-align:center;cursor:pointer;min-width:0}
.dayCell.today{border-color:#7a3e0c;background:#211307}
.dayCell.selected{outline:2px solid var(--orange);outline-offset:-2px}

.dayDot.active{background:var(--orange)}
.dayDot.work{background:var(--green)}

.emptyCalendar{padding:14px;border:1px dashed #333;border-radius:13px;color:#888;text-align:center}

<script>
/* ===== 896 FIT V22 LIVE ENGINE ===== */
let v22Live={
 exercises:[], index:0, set:1, started:false, setStarted:false,
 setStart:0, elapsed:0, elapsedTimer:null, restTimer:null, restLeft:0,
 restAuto:45, sessionDate:today(), completedSets:0
};

function v22TodayIndex(){return (new Date().getDay()+6)%7}
function v22LoadPlan(){
 const p=normalizeProgramV21(activeProgram());
 const i=v22TodayIndex();
 v22Live.exercises=p.days[i]?(p.dayExercises[i]||[]):[];
 return p;
}
function v22Format(s){
 s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function v22Reset(){
 clearInterval(v22Live.elapsedTimer);clearInterval(v22Live.restTimer);
 const p=v22LoadPlan();
 v22Live={exercises:p.days[v22TodayIndex()]?(p.dayExercises[v22TodayIndex()]||[]):[],index:0,set:1,started:false,setStarted:false,setStart:0,elapsed:0,elapsedTimer:null,restTimer:null,restLeft:0,restAuto:45,sessionDate:today(),completedSets:0};
 renderV22Live();
}
function startV22Live(){
 if(!v22Live.exercises.length){renderV22Live();return}
 if(v22Live.started)return;
 v22Live.started=true;
 v22Live.setStarted=false;
 v22Live.elapsedTimer=setInterval(()=>{
   v22Live.elapsed++;
   const el=document.getElementById('v22Elapsed');if(el)el.textContent=v22Format(v22Live.elapsed);
 },1000);
 renderV22Live();
}
function selectFoodForAdd(x){
 selectedFood={name:x[0],category:x[1],portion:x[2],cal:Number(x[3]),protein:Number(x[4]||0),carb:Number(x[5]||0)};
 selectedCook='boiled'; renderCookOptions(); updateFoodEstimate();
 document.getElementById('cookOptions')?.scrollIntoView({behavior:'smooth',block:'center'});
}
function updateFoodEstimate(){
 const el=document.getElementById('foodEstimate');
 if(!el || !selectedFood)return;
 const method=cookMethods.find(c=>c.id===selectedCook)||cookMethods[0];
 const base=Number(selectedFood.cal)||0;
 const portion=Number(selectedFood.portion)||1;
 const extra=Number(method?.extra||0);
 const kcal=Math.max(0,Math.round(base*portion+extra));
 el.textContent=`${kcal} kcal`;
}
function arrowPhoto(src,type,phase,cls=''){return `<div class="photoArrowWrap ${cls}"><img src="${src}" loading="lazy" onerror="this.style.opacity='.25'">${moveArrow(type,phase)}</div>`}
function detailMove(x){
 const info=moveInfo[x[0]]||{target:x[1],secondary:'',what:`${x[0]} hareketi ${x[1]} bölgesini hedefler.`,steps:['Başlangıç pozisyonunu kontrollü al.','Hareketi yavaş ve kontrollü şekilde gerçekleştir.','Başlangıç pozisyonuna kontrollü dön.'],tips:'Form bozuluyorsa dur ve uygun seviyeye dön.',tempo:'Kontrollü tempo'};
 const src=imgForMove(x),alt=x[0].includes('Bench')?photo.bench2:src,type=x[4]||'squat';
 document.getElementById('modalBody').innerHTML=`
 <div class="row"><h2>${x[0]}</h2><button class="btn" onclick="closeModal()">✕</button></div>
 <p class="muted">🎯 ${info.target}${info.secondary?' • '+info.secondary:''}</p>
 ${arrowPhoto(src,type,1,'detailHeroArrow')}
 <p class="photoNote">Gerçek hareket fotoğrafı + yön oku. Turuncu ok, hareketin temel yönünü gösterir.</p>
 <div class="card"><b>💡 Bu hareket nedir?</b><p>${info.what}</p></div>
 <div class="card"><b>📖 Nasıl yapılır?</b>
   <ol class="stepList">
    ${info.steps.map((z,i)=>`<li><div><b>${['Başlangıç pozisyonu','Kontrollü hareket','Kontrollü dönüş'][i]||'Adım'}</b><br>${z}</div></li>`).join('')}
   </ol>
 </div>
 <div class="card">
   <b>👀 Gerçek görselle hareketin her aşaması</b>
   <p class="muted">Fotoğrafın üzerine eklenen ok, o aşamada nereye ve hangi yönde hareket etmen gerektiğini gösterir.</p>
   <div class="phaseGrid">
     <div class="phaseCard">${arrowPhoto(src,type,3)}<b>1. Başlangıç / hazırlık</b></div>
     <div class="phaseCard">${arrowPhoto(alt,type,1)}<b>2. Kontrollü iniş / çekiş</b></div>
     <div class="phaseCard">${arrowPhoto(src,type,2)}<b>3. İtiş / dönüş</b></div>
   </div>
   <p class="muted" style="margin-top:10px">Önce pozisyonu kur → yavaş hareket et → kontrol ederek başlangıca dön.</p>
 </div>
 <div class="card"><b>⚠️ Dikkat</b><p>${info.tips}</p>
   <div class="grid"><div class="stat"><b>${x[2]}</b><span>Zorluk</span></div><div class="stat"><b>${info.tempo}</b><span>Önerilen tempo</span></div></div>
 </div>
 <button class="btn orange" style="width:100%" onclick='addMove(${JSON.stringify(x)});closeModal()'>＋ Programa Ekle</button>`;
 document.getElementById('modal').classList.add('open')
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function renderEquipment(){
 const names=['Dumbbell','Direnç Bandı','Barbell','Kettlebell','Cable','Treadmill','Vücut Ağırlığı'];document.getElementById('equipSelect').innerHTML=names.map(n=>`<option>${n}</option>`).join('');
 const e=document.getElementById('equipSelect').value;document.getElementById('equipLevel').innerHTML=(e==='Dumbbell'?['2.5 kg','5 kg','10 kg','20 kg','40 kg','60 kg','80 kg']:e==='Direnç Bandı'?['Hafif','Orta','Ağır','Çok ağır']:['Standart']).map(x=>`<option>${x}</option>`).join('');
 const list=moves.filter(x=>x[3]===e);document.getElementById('equipmentResult').innerHTML=`<div class="card"><b>${e} ile yapılabilecek ${list.length} hareket</b>${list.map(x=>`<div class="equip"><div class="grow"><b>${x[0]}</b><div class="muted">${x[1]} • ${x[2]}</div></div><button class="btn orange" onclick='addMove(${JSON.stringify(x)})'>+</button></div>`).join('')}</div>`;
}
function addProgram(){let day=prompt('Program günü (Pazartesi, Salı...)','Pazartesi');if(!day)return;data.programs.push({day,name:day+' Programı',moves:[]});save();renderAll()}
function renderPrograms(){const defaults=data.programs.length?data.programs:[{day:'Pazartesi',name:'Üst Vücut'},{day:'Salı',name:'Alt Vücut + Karın'},{day:'Çarşamba',name:'Dinlenme'}];document.getElementById('programList').innerHTML=defaults.map((p,i)=>`<div class="program"><div class="iconbox">📋</div><div class="grow"><b>${p.day}</b><div class="muted">${p.name} • ${data.programMoves.length} hareket • ${data.programMoves.reduce((a,m)=>a+m.sets,0)} set</div></div><button class="btn orange" onclick="startProgram(${i})">▶ Başlat</button></div>`).join('');document.getElementById('programMoves').innerHTML=data.programMoves.length?data.programMoves.map((m,i)=>`<div class="move"><div class="grow"><b>${m.name}</b><div class="muted">(${m.body}) • ${m.equipment}</div><div class="row" style="margin-top:7px"><button class="btn" onclick="changeMove(${i},'sets',-1)">−</button><span>${m.sets} set × ${m.reps} tekrar</span><button class="btn" onclick="changeMove(${i},'sets',1)">+</button></div></div><button class="btn" onclick="changeMove(${i},'reps',-1)">− tekrar</button><button class="btn" onclick="changeMove(${i},'reps',1)">+ tekrar</button></div>`).join(''):'Henüz hareket eklemedin. Antrenman sekmesinden + ile ekleyebilirsin.'}
function startProgram(){if(!data.programMoves.length)return toast('Önce programa hareket ekle.');show('live');startLive()}
function changeMove(i,k,d){data.programMoves[i][k]=Math.max(1,data.programMoves[i][k]+d);save();renderPrograms()}
let effortPeriod='week';
function periodStart(period){const d=new Date();d.setHours(0,0,0,0);if(period==='week'){const day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1))}else if(period==='month'){d.setDate(1)}else{d.setMonth(0,1)}return d.toISOString().slice(0,10)}
function renderWeight(){let last=data.weights.at(-1)?.weight??data.startWeight,prev=data.weights.length>1?data.weights[data.weights.length-2].weight:null,change=last!=null&&prev!=null?last-prev:null;document.getElementById('weightSummary').innerHTML=`<div class="grid"><div class="stat"><b>${data.startWeight??'—'}</b><span>🏁 Başlangıç</span></div><div class="stat"><b>${last??'—'}</b><span>⚖️ Son ölçüm</span></div><div class="stat"><b>${data.startWeight!=null&&last!=null?(last-data.startWeight).toFixed(1):'—'}</b><span>Toplam değişim</span></div><div class="stat"><b>${data.weights.length}</b><span>Tartım kaydı</span></div></div>`;document.getElementById('weightHistory').innerHTML=data.weights.slice().reverse().map(w=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #242424"><span>${w.date}</span><b>${w.weight} kg</b></div>`).join('')||'<span class="muted">Henüz tartım kaydı yok.</span>';document.getElementById('weighDay').innerHTML=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'].map((x,i)=>`<option value="${i}" ${i===data.weighDay?'selected':''}>${x}</option>`).join('');document.getElementById('weightMessage').textContent=change===null?'İlk tartımını kaydet. Başlangıç noktanı birlikte takip edeceğiz. 💪':change<0?`🔥 Geçen haftaya göre ${Math.abs(change).toFixed(1)} kg daha aşağıdasın. Emeğin tartıda görünüyor. Gurur duyabilirsin. 😎`:change===0?'💪 Tartı aynı. Tek bir ölçüm bütün emeğini anlatmaz. Devam ediyoruz.':'🟠 Bu hafta ölçüm yükselmiş olabilir. Moral bozmak yok; asıl önemli olan uzun vadeli gidişat ve verdiğin emek.';renderEffort()}
function addWeight(){let v=parseFloat(document.getElementById('weightInput').value);if(!v)return;let prev=data.weights.at(-1)?.weight;if(data.startWeight===null){data.startWeight=v;toast('🏁 Başlangıç kilon kaydedildi. Bundan sonra korunacak.')}data.weights.push({date:today(),weight:v});data.xp+=20;save();document.getElementById('weightInput').value='';toast(prev==null?'⚖️ Başlangıç kilon kaydedildi.':v<prev?`🔥 ${(prev-v).toFixed(1)} kg değişim. İyi iş!`:'💪 Kayıt alındı. Yolculuk devam ediyor.');renderAll()}
function saveWeightDay(){data.weighDay=+document.getElementById('weighDay').value;save()}
function resetStartWeight(){if(confirm('Başlangıç kilosunu gerçekten sıfırlamak istiyor musun?')){data.startWeight=null;save();renderAll()}}
function setEffortPeriod(p,btn){effortPeriod=p;document.querySelectorAll('#weight .chip').forEach(x=>x.classList.remove('on'));btn.classList.add('on');renderEffort()}
function renderEffort(){const p=effortPeriod||'week',start=periodStart(p),meals=data.meals.filter(x=>x.date>=start&&x.date<=today()),logs=data.workoutLogs.filter(x=>x.date>=start&&x.date<=today()),sets=logs.reduce((a,x)=>a+(x.sets||0),0),cal=meals.reduce((a,x)=>a+(x.cal||0),0),secs=logs.reduce((a,x)=>a+(x.seconds||0),0);document.getElementById('effortSets').textContent=sets;document.getElementById('effortCalories').textContent=cal;document.getElementById('effortHours').textContent=`${Math.floor(secs/3600)}s ${Math.floor(secs%3600/60)}dk`;document.getElementById('effortWorkouts').textContent=logs.length;document.getElementById('effortMessage').textContent=logs.length?`Bu ${p==='week'?'hafta':p==='month'?'ay':'yıl'} verdiğin emek burada: ${logs.length} antrenman, ${sets} set ve ${Math.floor(secs/60)} dakika. Sonucu değil, süreci de görüyorsun. 🖤🟧`:'Bu dönemde henüz antrenman kaydı yok. İlk adımı atınca burada birikecek. 💪'}
function renderMissions(){let done=data.claimed[today()]||{};let ms=[['water','💧 2.5 L su iç',20],['steps','🚶 5.000 adım at',20],['sets','🏋️ 20 set tamamla',25],['meal','🍽️ Öğünlerini kaydet',15]];document.getElementById('missionList').innerHTML=ms.map(m=>{let cur=m[0]==='water'?data.water:m[0]==='steps'?data.steps:m[0]==='sets'?data.sets:data.meals.filter(x=>x.date===today()).length;let ok=!!done[m[0]]||cur>=(m[0]==='water'?2.5:m[0]==='steps'?5000:m[0]==='sets'?20:1);return `<div class="mission"><div class="grow"><b>${m[1]}</b><div class="${ok?'good':'muted'}">${ok?'Tamamlandı ✅':'Devam ediyor'}</div></div><span>+${m[2]} XP</span></div>`}).join('')}
function claimSurprise(){let k=today();if(data.claimed[k]?.surprise)return toast('Bugünün sürprizini zaten aldın 😅');data.claimed[k]={...(data.claimed[k]||{}),surprise:true};data.xp+=50;save();toast('🎁 +50 XP! Bugünün sürprizi alındı.');renderAll()}
function renderRank(){
 let idx=Math.min(ranks.length-1,Math.floor(data.xp/500)),base=idx*500,next=(idx+1)*500;
 document.getElementById('rankName').textContent=ranks[idx][0];
 document.getElementById('rankDesc').textContent=ranks[idx][1];
 const pct=idx===ranks.length-1?100:Math.min(100,((data.xp-base)/(next-base))*100);
 document.getElementById('rankBar').style.width=pct+'%';
 document.getElementById('rankXp').textContent=`${data.xp} XP • sonraki rütbe: ${idx<ranks.length-1?next+' XP':'MAKSİMUM'}`;
 document.getElementById('rankSets').textContent=data.sets;
 document.getElementById('rankSteps').textContent=data.steps;
 document.getElementById('rankDays').textContent=new Set(data.weights.map(x=>x.date)).size+data.workouts;
 document.getElementById('rankStreak').textContent=`🔥 ${currentStreak()} gün seri`;
 document.getElementById('rankJourney').innerHTML=ranks.map((r,i)=>{
   const done=i<idx,on=i===idx;
   const req=i*500;
   return `<div class="rankStep ${on?'on':''} ${done?'done':''}"><div class="rankOrb">${done?'✓':on?'896':'•'}</div><div class="grow"><b>${r[0]}</b><span>${r[1]} • ${req} XP</span></div>${on?'<span class="orangeText">BURADASIN</span>':done?'<span class="good">Tamam</span>':''}</div>`;
 }).join('');
 if(idx<ranks.length-1){
   document.getElementById('nextRankName').textContent=ranks[idx+1][0];
   document.getElementById('nextRankText').textContent=`${Math.max(0,next-data.xp)} XP daha kazanırsan ${ranks[idx+1][0]} açılıyor. Her kayıt, set ve görev seni oraya yaklaştırıyor.`;
   document.getElementById('nextRankBar').style.width=pct+'%';
 }else{
   document.getElementById('nextRankName').textContent='LEGEND';
   document.getElementById('nextRankText').textContent='Maksimum rütbedesin. Artık hedef yeni bir seviye değil, kendi rekorunu geliştirmek.';
   document.getElementById('nextRankBar').style.width='100%';
 }
 const milestones=[['msSets',data.sets>=100],['msWorkouts',data.workouts>=10],['msSteps',data.steps>=50000],['msXp',data.xp>=1000]];
 milestones.forEach(([id,ok])=>document.getElementById(id).classList.toggle('done',ok));
}
function renderHome(){let meals=data.meals.filter(x=>x.date===today()),cal=meals.reduce((s,x)=>s+(x.cal||0),0);document.getElementById('homeCal').textContent=cal;document.getElementById('homeXp').textContent=data.xp;document.getElementById('waterHome').textContent=data.water.toFixed(1)+' L';document.getElementById('stepsHome').textContent=data.steps;document.getElementById('setsHome').textContent=data.sets;document.getElementById('quote').textContent='“'+quotes[new Date().getDay()%quotes.length]+'”';document.getElementById('surprise').textContent=surprises[new Date().getDay()%surprises.length];document.getElementById('surprise2').textContent=surprises[new Date().getDay()%surprises.length];document.getElementById('homeFoods').innerHTML=meals.map(x=>`<div class="food"><div class="grow"><b>${x.name}</b><div class="muted">${x.portion}</div></div><span>${x.cal||0} kcal</span></div>`).join('')||'<span class="muted">Bugün henüz öğün eklenmedi.</span>';document.getElementById('homeMissions').innerHTML='<div class="muted">Görevler hazır. Bugün küçük bir adım bile sayılır. 😎</div>'}
function dateKey(d){return new Date(d+'T12:00:00').toISOString().slice(0,10)}
function addDays(key,n){const d=new Date(key+'T12:00:00');d.setDate(d.getDate()+n);return dateKey(d)}
function monthKey(key){return key.slice(0,7)}
function logsForDate(d){return data.workoutLogs.filter(x=>x.date===d)}
function setsForDate(d){return logsForDate(d).reduce((a,x)=>a+(x.sets||0),0)}
function secondsForDate(d){return logsForDate(d).reduce((a,x)=>a+(x.seconds||0),0)}
function mealsForDate(d){return data.meals.filter(x=>x.date===d)}
function calForDate(d){return mealsForDate(d).reduce((a,x)=>a+(x.cal||0),0)}
function renderCalendarDay(){
 const input=document.getElementById('calDate');
 let d=input?.value||today(); if(input)input.value=d;
 const ms=mealsForDate(d), sets=setsForDate(d), secs=secondsForDate(d), kcal=calForDate(d);
 const dt=new Date(d+'T12:00:00');
 const dayName=dt.toLocaleDateString('tr-TR',{weekday:'long'});
 document.getElementById('calSelectedLabel').textContent=dt.toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'});
 document.getElementById('calDay').innerHTML=`
   <div class="grid3">
    <div class="stat"><b>${ms.length}</b><span>Öğün</span></div>
    <div class="stat"><b>${kcal}</b><span>Alınan kcal</span></div>
    <div class="stat"><b>${sets}</b><span>Set</span></div>
   </div>
   <div class="card" style="margin:10px 0 0;background:#0e0e0e">
    <div class="row"><b>${dayName.charAt(0).toUpperCase()+dayName.slice(1)}</b><span class="orangeText">${formatTime(secs)}</span></div>
    <div class="muted" style="margin-top:5px">${secs?`🏋️ ${Math.floor(secs/60)} dk antrenman kaydı`: 'Henüz tamamlanmış antrenman kaydı yok.'}</div>
   </div>
   ${ms.length?`<div style="margin-top:12px"><b>🍽️ Öğünler</b>${ms.map(x=>`<div class="foodVisual"><img class="foodThumb" src="${foodImg(x.name)}" loading="lazy" alt="${x.name}" onerror="this.src=foodFallback"><div class="foodInfo"><b>${x.name}</b><div class="muted">${x.portion}</div></div><span>${x.cal||0} kcal</span></div>`).join('')}</div>`:'<div class="emptyCalendar" style="margin-top:12px">Bu güne kayıtlı öğün yok.</div>'}
 `;
 renderCalendarWeek(d);
 renderCalendarPeriod(d);
 renderCalendarTimeline(d);
 const next=ms.length&&sets?`Bugün hem beslenme hem antrenman kaydı var. 🔥 Bu disiplin 896 seviyesidir.`:sets?`Antrenman tamam. Beslenme kaydını da ekleyip günü kapatabilirsin. 😎`:ms.length?`Beslenme tamam. Kısa bir hareket bile bugününü tamamlar. 💪`:`Bugünü boş bırakma. Bir öğün veya kısa bir yürüyüşle takvime iz bırak.`;
 document.getElementById('calendarNextStep').textContent=next;
}
function renderCalendarWeek(selected){
 const start=addDays(selected,-((new Date(selected+'T12:00:00').getDay()+6)%7));
 const labels=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
 document.getElementById('weekStrip').innerHTML=Array.from({length:7},(_,i)=>{
   const d=addDays(start,i),ms=mealsForDate(d).length,sets=setsForDate(d),isToday=d===today(),isSel=d===selected;
   const dd=new Date(d+'T12:00:00').getDate();
   return `<div class="dayCell ${isToday?'today':''} ${isSel?'selected':''}" onclick="document.getElementById('calDate').value='${d}';renderCalendarDay()"><b>${labels[i]}</b><span>${dd}</span><i class="dayDot ${ms||sets?'active':''}"></i>${sets?`<small style="display:block;color:#57d68d;font-size:9px">${sets} set</small>`:''}</div>`;
 }).join('');
}
function renderCalendarPeriod(selected){
 const mk=monthKey(selected),monthMeals=data.meals.filter(x=>monthKey(x.date)===mk);
 const monthLogs=data.workoutLogs.filter(x=>monthKey(x.date)===mk);
 const active=new Set([...monthMeals.map(x=>x.date),...monthLogs.map(x=>x.date)]).size;
 const sets=monthLogs.reduce((a,x)=>a+(x.sets||0),0);
 const secs=monthLogs.reduce((a,x)=>a+(x.seconds||0),0);
 document.getElementById('calendarPeriodLabel').textContent=new Date(selected+'T12:00:00').toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
 document.getElementById('calActiveDays').textContent=active;
 document.getElementById('calMealCount').textContent=monthMeals.length;
 document.getElementById('calSetCount').textContent=sets;
 document.getElementById('calWorkoutHours').textContent=(secs/3600).toFixed(1)+'s';
}
function renderCalendarTimeline(selected){
 const start=addDays(selected,-((new Date(selected+'T12:00:00').getDay()+6)%7));
 const labels=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
 document.getElementById('calendarTimeline').innerHTML=Array.from({length:7},(_,i)=>{
   const d=addDays(start,i),ms=mealsForDate(d),sets=setsForDate(d),secs=secondsForDate(d);
   return `<div class="timelineItem"><div class="timelineIcon">${sets?'🏋️':ms.length?'🍽️':'○'}</div><div class="grow"><b>${labels[i]}</b><div class="muted">${ms.length} öğün • ${sets} set • ${secs?Math.floor(secs/60)+' dk':''}</div></div><span class="${sets?'good':'muted'}">${sets?'Tamamlandı':'Boş'}</span></div>`;
 }).join('');
}
function renderStats(){for(const [id,v] of Object.entries({stSets:data.sets,stReps:data.reps,stSteps:data.steps,stWater:data.water.toFixed(1)+' L',stWorkouts:data.workouts,stMeals:data.meals.length,stDays:new Set(data.meals.map(x=>x.date)).size+data.workouts,stXp:data.xp}))document.getElementById(id).textContent=v}
let liveTick=null;
function ensureStreak(){if(!Array.isArray(data.streakDays))data.streakDays=[];}
function markActiveDay(){ensureStreak();const d=today();if(!data.streakDays.includes(d)){data.streakDays.push(d);data.streakDays=data.streakDays.slice(-365);save()}}
function currentStreak(){ensureStreak();let set=new Set(data.streakDays),d=new Date();let n=0;for(;;){const key=d.toISOString().slice(0,10);if(!set.has(key))break;n++;d.setDate(d.getDate()-1)}return n}
function streakVisual(n){if(n>=100)return ['s100','🔥','100+ günlük seri'];if(n>=30)return ['s30','🔥','30 günlük seri'];if(n>=14)return ['s14','🔥','14 günlük seri'];if(n>=7)return ['s7','🔥','7 günlük seri'];if(n>=4)return ['s4','🔥','4 günlük seri'];return ['','🔥',n+' günlük seri']}
function renderStreak(){markActiveDay();const n=currentStreak(),v=streakVisual(n),ic=document.getElementById('streakIcon');if(!ic)return;ic.className='streakIcon '+v[0];ic.textContent=v[1];document.getElementById('streakTitle').textContent=v[2];document.getElementById('streakMsg').textContent=n>=30?'896 alevi artık kendi kendine yanıyor. 😎':n>=7?'Kıvılcım büyüdü. Devam et. 🔥':'Bugün de bir kıvılcım bıraktın.'}
function startLive(){if(!data.programMoves.length)return toast('Önce programa hareket ekle.');if(liveTick)clearInterval(liveTick);data.live={active:true,move:0,set:1,phase:'set',seconds:0,restLeft:0,total:0,completedSets:0,completedReps:0};save();renderLive();liveTick=setInterval(()=>{if(!data.live?.active)return;data.live.seconds++;data.live.total++;save();renderLiveTimerOnly()},1000)}
function setFinished(){if(!data.live?.active)return;const m=data.programMoves[data.live.move];data.sets++;data.reps+=(m?.reps||0);data.xp+=3;data.live.completedSets=(data.live.completedSets||0)+1;data.live.completedReps=(data.live.completedReps||0)+(m?.reps||0);markActiveDay();data.live.phase='rest';data.live.restLeft=m?.rest||90;data.live.seconds=0;save();renderLive();toast('🔥 Set tamam! Şimdi kontrollü dinlen.');}
function finishRest(){if(!data.live?.active)return;nextLiveSet();}
function nextLiveSet(){const m=data.programMoves[data.live.move];if(data.live.set<m.sets){data.live.set++;data.live.phase='set';data.live.seconds=0;data.live.restLeft=0}else if(data.live.move<data.programMoves.length-1){data.live.move++;data.live.set=1;data.live.phase='set';data.live.seconds=0;data.live.restLeft=0}else{finishLive();return}save();renderLive()}
function finishLive(){const total=data.live?.total||0;const completedSets=data.live?.completedSets||0;const completedReps=data.live?.completedReps||0;data.workoutLogs.push({date:today(),seconds:total,sets:completedSets,reps:completedReps});data.workouts++;data.xp+=20;data.live=null;if(liveTick){clearInterval(liveTick);liveTick=null}save();toast(`🏆 Antrenman tamamlandı! ${Math.floor(total/60)} dk ${total%60} sn. 896 onayladı. 😎`);renderAll()}
function renderLiveTimerOnly(){const t=document.getElementById('liveTimer');if(!t||!data.live)return;const seconds=data.live.phase==='rest'?data.live.restLeft:data.live.seconds;t.textContent=formatTime(data.live.phase==='rest'?Math.max(0,seconds):seconds);t.classList.toggle('warn',data.live.phase==='rest'&&seconds<=10);if(data.live.phase==='rest'&&data.live.restLeft>0){data.live.restLeft--;save();if(data.live.restLeft<=0){toast('💪 Dinlenme bitti! Sıradaki set.');nextLiveSet()}}}
function formatTime(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderLive(){const box=document.getElementById('liveBox');if(!data.programMoves.length){box.innerHTML='<p class="muted">Önce programa birkaç hareket ekle.</p>';return}if(!data.live?.active){box.innerHTML=`<div class="row"><div><b>Hazır mısın?</b><div class="muted">${data.programMoves.length} hareket • kontrollü tempo</div></div><button class="btn orange" onclick="startLive()">▶ Antrenmanı Başlat</button></div>`;return}const m=data.programMoves[data.live.move];const phase=data.live.phase==='rest';const secs=phase?data.live.restLeft:data.live.seconds;box.innerHTML=`<div class="liveMove">${m.name}</div><div class="liveMeta">(${m.body}) • ${data.live.move+1} / ${data.programMoves.length} hareket</div><div class="card" style="margin-top:14px"><div class="timerWrap"><div><div class="timerLabel">${phase?'DİNLENME':'SET '+data.live.set+' / '+m.sets}</div><div id="liveTimer" class="timer ${phase&&secs<=10?'warn':''}">${formatTime(secs)}</div></div></div><div class="row"><span class="muted">${phase?'Sonraki sete hazırlan':'Hedef: '+m.reps+' tekrar'}</span><span class="orangeText">⏱️ ${m.targetSec||60} sn öneri</span></div><div class="liveBtns">${phase?`<button class="btn orange" onclick="finishRest()">Dinlenmeyi Bitir</button><button class="btn" onclick="finishLive()">Antrenmanı Bitir</button>`:`<button class="btn orange" onclick="setFinished()">Set Bitti • Dinlenmeye Geç</button><button class="btn" onclick="finishLive()">Antrenmanı Bitir</button>`}</div></div>`}
function renderSettings(){document.getElementById('userName').value=data.name;document.getElementById('jokeMode').value=data.joke?'on':'off'}
function saveSettings(){data.name=document.getElementById('userName').value||'Şampiyon';data.joke=document.getElementById('jokeMode').value==='on';save();toast('Ayarlar kaydedildi 😎')}
function renderAll(){renderHome();renderStreak();renderFoods();renderMoves();renderEquipment();renderPrograms();renderWeight();renderMissions();renderRank();renderStats();renderLive();renderSettings();document.getElementById('calDate').value=today();renderCalendarDay()}
renderAll();
setTimeout(()=>{try{renderCookOptions();renderProgramV20();renderV21DayEditors();renderV21TodayProgram();renderV20Coach();v22Reset();v22EnsureExerciseListVisible();}catch(e){console.error(e)}},50);

/* ===== V22 FIX: exercise list visible without clicking search ===== */
function v22EnsureExerciseListVisible(){
  try{
    if(typeof renderExercises==='function') renderExercises();
    else if(typeof renderMoves==='function') renderMoves();
    else if(typeof renderWorkoutExercises==='function') renderWorkoutExercises();
  }catch(e){}
  // Remove any accidental "only after search" display gate.
  document.querySelectorAll('#exerciseList, #movesList, .exercise-list, .moves-list').forEach(el=>{
    if(el) el.style.display='';
  });
}
document.addEventListener('DOMContentLoaded',()=>{
  setTimeout(v22EnsureExerciseListVisible,80);
});

</script>
